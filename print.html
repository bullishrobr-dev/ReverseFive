<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receipt</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.3;
            color: #000;
            background: #fff;
            padding: 8px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.3;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-family: "Courier New", monospace;
            font-size: 14px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        @media print {
            .btn { display: none; }
            body { padding: 4px; }
        }
    </style>
</head>
<body>
    <button class="btn" onclick="window.print()">PRINT RECEIPT</button>
    <pre id="receipt"></pre>
    <button class="btn" onclick="window.print()">PRINT RECEIPT</button>

    <script>
    (function() {
        function getOffer() {
            var p = new URLSearchParams(location.search).get('d');
            if (!p) return null;
            try { return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))); }
            catch(e) { return null; }
        }

        var giftNames = {
            'day-cream':'Crema de Dia',
            'night-cream':'Crema de Noche',
            'facial-serum':'Serum Facial',
            'eye-serum':'Serum de Ojos',
            'eye-cream':'Contorno de Ojos',
            'facial-peel':'Peeling Facial',
            'body-scrub':'Exfoliante Corporal',
            'body-butter':'Mantequilla Corporal',
            'nail-kit':'Kit de Unas',
            'facial-cleanser':'Limpiador Facial'
        };

        var offer = getOffer();
        if (!offer) {
            document.getElementById('receipt').textContent = 'Oferta no encontrada';
            return;
        }

        var units = offer.units || 1;
        var regular = 300 * units;
        var custom = offer.price * units;
        var savings = regular - custom;
        var expiry = new Date(offer.expires);
        var gifts = offer.gifts || [];

        var lines = [];
        lines.push('');
        lines.push('       ZERO LINES');
        lines.push('       ANDORRA');
        lines.push('----------------------------');
        lines.push('      OFERTA EXCLUSIVA');
        lines.push('');
        lines.push('      Oferta Especial');
        lines.push('      Para: ' + (offer.customer || 'Usted'));
        lines.push('');
        lines.push('  Preparada por: ' + (offer.seller || 'Vendedor'));
        lines.push('----------------------------');
        lines.push('');
        lines.push('   Reverse Five Wrinkle');
        lines.push('        Eraser');
        lines.push('');
        lines.push('  ' + units + ' unidad' + (units > 1 ? 'es' : ''));
        lines.push('  100 tratamientos - 2 anos');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Precio regular:     EUR ' + regular);
        lines.push('TU PRECIO:          EUR ' + custom);
        lines.push('AHORRAS:            EUR ' + savings);
        lines.push('----------------------------');
        lines.push('');

        if (gifts.length > 0) {
            lines.push('REGALOS INCLUIDOS (' + gifts.length + ')');
            lines.push('');
            gifts.forEach(function(g) {
                lines.push('+ ' + (giftNames[g] || g));
            });
            lines.push('');
            lines.push('----------------------------');
            lines.push('');
        }

        if (offer.note) {
            lines.push('"' + offer.note + '"');
            lines.push('');
            lines.push('----------------------------');
            lines.push('');
        }

        lines.push('RECLAMA TU OFERTA:');
        lines.push('');
        var url = location.href;
        for (var i = 0; i < url.length; i += 28) {
            lines.push(url.substring(i, i + 28));
        }
        lines.push('');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Oferta expira:');
        lines.push(expiry.toLocaleString('es-ES'));
        lines.push('');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Gracias por su confianza');
        lines.push('Zero Lines - Andorra');
        lines.push('+350 5400 5198');
        lines.push('');
        lines.push('============================');
        lines.push('');
        lines.push('');
        lines.push('');

        document.getElementById('receipt').textContent = lines.join('\n');
    })();
    </script>
</body>
</html>
