<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zero Lines Receipt</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.4;
            color: #000;
            background: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #receipt-paper {
            background: #fff;
            width: 384px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-bottom: 16px;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.3;
        }
        .btn {
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0ABAB5;
            color: #fff;
            margin: 6px;
        }
        .btn:hover { background: #089994; }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
            max-width: 400px;
        }

        /* Print styles */
        @media print {
            body {
                background: #fff;
                padding: 0;
                align-items: flex-start;
            }
            #receipt-paper {
                box-shadow: none;
                width: 100%;
                padding: 4px;
                margin: 0;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button class="btn" onclick="window.print()">PRINT RECEIPT</button>
        <p class="note">If your thermal printer is connected, select it in the print dialog.<br>For best results, install the local print server (see Bridge Setup in admin panel).</p>
    </div>

    <div id="receipt-paper">
        <pre id="receipt"></pre>
    </div>

    <div class="no-print">
        <button class="btn" onclick="window.print()">PRINT RECEIPT</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
    (function() {
        function getOffer() {
            var p = new URLSearchParams(location.search).get('d');
            if (!p) return null;
            try { return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))); }
            catch(e) { return null; }
        }

        var giftNames = {
            'day-cream':'Crema de Dia','night-cream':'Crema de Noche',
            'facial-serum':'Serum Facial','eye-serum':'Serum de Ojos',
            'eye-cream':'Contorno de Ojos','facial-peel':'Peeling Facial',
            'body-scrub':'Exfoliante Corporal','body-butter':'Mantequilla Corporal',
            'nail-kit':'Kit de Unas','facial-cleanser':'Limpiador Facial'
        };

        var offer = getOffer();
        if (!offer) {
            document.getElementById('receipt').textContent = 'Oferta no encontrada';
            return;
        }

        var units = offer.units || 1;
        var regular = 300 * units;
        var custom = offer.price * units;
        var savings = regular - custom;
        var expiry = new Date(offer.expires);
        var gifts = offer.gifts || [];

        var lines = [];
        lines.push('');
        lines.push('       ZERO LINES');
        lines.push('       ANDORRA');
        lines.push('----------------------------');
        lines.push('      OFERTA EXCLUSIVA');
        lines.push('');
        lines.push('      Oferta Especial');
        lines.push('      Para: ' + (offer.customer || 'Usted'));
        lines.push('');
        lines.push('  Preparada por: ' + (offer.seller || 'Vendedor'));
        lines.push('----------------------------');
        lines.push('');
        lines.push('   Reverse Five Wrinkle');
        lines.push('        Eraser');
        lines.push('');
        lines.push('  ' + units + ' unidad' + (units > 1 ? 'es' : ''));
        lines.push('  100 tratamientos - 2 anos');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Precio regular:     EUR ' + regular);
        lines.push('TU PRECIO:          EUR ' + custom);
        lines.push('AHORRAS:            EUR ' + savings);
        lines.push('----------------------------');
        lines.push('');

        if (gifts.length > 0) {
            lines.push('REGALOS INCLUIDOS (' + gifts.length + ')');
            lines.push('');
            gifts.forEach(function(g) {
                lines.push('+ ' + (giftNames[g] || g));
            });
            lines.push('');
            lines.push('----------------------------');
            lines.push('');
        }

        if (offer.note) {
            lines.push('"' + offer.note + '"');
            lines.push('');
            lines.push('----------------------------');
            lines.push('');
        }

        lines.push('RECLAMA TU OFERTA:');
        lines.push('');
        var url = location.href;
        for (var i = 0; i < url.length; i += 32) {
            lines.push(url.substring(i, i + 32));
        }
        lines.push('');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Oferta expira:');
        lines.push(expiry.toLocaleString('es-ES'));
        lines.push('');
        lines.push('----------------------------');
        lines.push('');
        lines.push('Gracias por su confianza');
        lines.push('Zero Lines - Andorra');
        lines.push('+350 5400 5198');
        lines.push('');
        lines.push('============================');
        lines.push('');
        lines.push('');
        lines.push('');

        document.getElementById('receipt').textContent = lines.join('\n');
    })();
    </script>
</body>
</html>
