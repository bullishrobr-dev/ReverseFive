<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Exclusiva | Reverse Five | Zero Lines</title>
    <meta name="description" content="Oferta exclusiva limitada para Reverse Five Wrinkle Eraser.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Offer Page Specific Styles */
        .offer-page {
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        .offer-header {
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .offer-header .container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offer-header img {
            height: 32px;
            width: auto;
        }

        .offer-hero {
            padding: 3rem 0 2rem;
            text-align: center;
        }

        .offer-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, rgba(10, 186, 181, 0.1) 0%, rgba(10, 186, 181, 0.05) 100%);
            border: 1px solid rgba(10, 186, 181, 0.2);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent-turquoise);
            margin-bottom: 1.5rem;
        }

        .offer-title {
            font-family: var(--font-display);
            font-size: clamp(1.75rem, 5vw, 3rem);
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #0ABAB5 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .offer-customer {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .countdown-timer {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .countdown-timer svg {
            color: var(--accent-turquoise);
            flex-shrink: 0;
        }

        .countdown-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .countdown-digits {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-turquoise);
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
        }

        .countdown-timer.urgent {
            border-color: rgba(239, 68, 68, 0.3);
            animation: urgentPulse 2s ease-in-out infinite;
        }

        .countdown-timer.urgent .countdown-digits {
            color: #ef4444;
        }

        @keyframes urgentPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 0 20px 4px rgba(239, 68, 68, 0.1); }
        }

        .offer-card {
            max-width: 520px;
            margin: 0 auto 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
        }

        .offer-product {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .offer-product img {
            width: 100px;
            height: auto;
            flex-shrink: 0;
        }

        .offer-product-info h3 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .offer-product-info p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .offer-pricing {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.9375rem;
        }

        .price-row.regular {
            color: var(--text-muted);
        }

        .price-row.regular .price-value {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .price-row.your-price {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--accent-turquoise);
        }

        .price-row.your-price .price-value {
            font-size: 1.5rem;
            font-family: var(--font-display);
        }

        .price-row.savings {
            padding-top: 0.75rem;
            margin-top: 0.5rem;
            border-top: 1px dashed var(--border-subtle);
            color: var(--accent-gold);
            font-weight: 600;
        }

        .offer-gifts {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .offer-gifts h4 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .gift-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 0.875rem;
            background: rgba(10, 186, 181, 0.05);
            border: 1px solid rgba(10, 186, 181, 0.1);
            border-radius: 10px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .gift-item svg {
            color: var(--accent-turquoise);
            flex-shrink: 0;
        }

        .offer-note {
            padding: 1rem 1.5rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
            font-style: italic;
            border-bottom: 1px solid var(--border-subtle);
        }

        .offer-cta {
            padding: 1.5rem;
            text-align: center;
        }

        .offer-cta .btn-primary {
            width: 100%;
            padding: 1rem 2rem;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }

        .offer-cta .btn-secondary {
            width: 100%;
            padding: 0.875rem 2rem;
            font-size: 0.875rem;
        }

        .offer-expired {
            text-align: center;
            padding: 4rem 1.5rem;
        }

        .offer-expired svg {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .offer-expired h2 {
            font-family: var(--font-display);
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .offer-expired p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .offer-footer {
            padding: 2rem 0;
            text-align: center;
            border-top: 1px solid var(--border-subtle);
        }

        .offer-footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .seller-info {
            padding: 0.75rem 1.5rem;
            background: rgba(212, 175, 55, 0.03);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-align: center;
        }

        .seller-info strong {
            color: var(--accent-gold);
        }

        /* Print styles — Thermal Receipt Optimised */
        @media print {
            @page {
                margin: 0;
                size: auto;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                background: #fff !important;
                color: #000 !important;
                font-family: 'Courier New', monospace !important;
                width: 100% !important;
                max-width: 80mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }

            .offer-header, .offer-footer, .countdown-timer,
            .btn-primary, .btn-secondary, .offer-cta {
                display: none !important;
            }

            .container {
                max-width: 100% !important;
                padding: 0 4mm !important;
                margin: 0 !important;
            }

            .offer-hero {
                padding: 2mm 0 !important;
            }

            .offer-title {
                font-size: 14pt !important;
                font-family: 'Courier New', monospace !important;
                -webkit-text-fill-color: #000 !important;
                background: none !important;
                color: #000 !important;
                margin-bottom: 1mm !important;
            }

            .offer-customer {
                font-size: 9pt !important;
                color: #333 !important;
                margin-bottom: 2mm !important;
            }

            .offer-eyebrow {
                font-size: 8pt !important;
                padding: 1mm 3mm !important;
                border: 1px solid #000 !important;
                background: none !important;
                color: #000 !important;
                margin-bottom: 2mm !important;
            }

            .offer-card {
                border: none !important;
                background: #fff !important;
                box-shadow: none !important;
                max-width: 100% !important;
                margin: 0 !important;
            }

            .seller-info {
                background: none !important;
                border: none !important;
                border-bottom: 1px dashed #000 !important;
                font-size: 8pt !important;
                padding: 2mm 0 !important;
                color: #333 !important;
            }

            .offer-product {
                flex-direction: column !important;
                padding: 2mm 0 !important;
                border-bottom: 1px dashed #000 !important;
                gap: 1mm !important;
            }

            .offer-product img {
                width: 30mm !important;
                height: auto !important;
                margin: 0 auto !important;
            }

            .offer-product-info h3 {
                font-size: 10pt !important;
                text-align: center !important;
                font-family: 'Courier New', monospace !important;
            }

            .offer-product-info p {
                font-size: 8pt !important;
                text-align: center !important;
            }

            .offer-pricing {
                padding: 2mm 0 !important;
                border-bottom: 1px dashed #000 !important;
            }

            .price-row {
                font-size: 9pt !important;
                padding: 1mm 0 !important;
            }

            .price-row.your-price .price-value {
                font-size: 12pt !important;
                font-family: 'Courier New', monospace !important;
            }

            .price-row.savings {
                color: #000 !important;
                font-weight: bold !important;
            }

            .offer-gifts {
                padding: 2mm 0 !important;
                border-bottom: 1px dashed #000 !important;
            }

            .offer-gifts h4 {
                font-size: 8pt !important;
                color: #000 !important;
                margin-bottom: 1mm !important;
            }

            .gift-grid {
                grid-template-columns: 1fr !important;
                gap: 0 !important;
            }

            .gift-item {
                background: none !important;
                border: none !important;
                padding: 0.5mm 0 !important;
                font-size: 8pt !important;
                color: #000 !important;
            }

            .gift-item svg {
                display: none !important;
            }

            .gift-item::before {
                content: "+ ";
            }

            .offer-note {
                padding: 2mm 0 !important;
                font-size: 8pt !important;
                border-bottom: 1px dashed #000 !important;
                color: #333 !important;
            }

            /* QR Code — the star of the show */
            .qr-area {
                display: block !important;
                padding: 3mm 0 !important;
                background: #fff !important;
                border: none !important;
                margin-top: 2mm !important;
            }

            .qr-area h3 {
                font-size: 9pt !important;
                color: #000 !important;
                margin-bottom: 2mm !important;
                text-transform: uppercase !important;
                letter-spacing: 0.1em !important;
            }

            #qrcode {
                display: block !important;
                margin: 0 auto !important;
                padding: 2mm !important;
                background: #fff !important;
                border: 1px solid #000 !important;
                width: 40mm !important;
                height: 40mm !important;
            }

            #qrcode img, #qrcode canvas {
                width: 100% !important;
                height: 100% !important;
                display: block !important;
            }

            .offer-url {
                display: none !important;
            }

            .qr-actions {
                display: none !important;
            }

            /* Receipt footer */
            .receipt-footer {
                text-align: center !important;
                padding: 3mm 0 !important;
                font-size: 7pt !important;
                color: #666 !important;
                border-top: 1px dashed #000 !important;
                margin-top: 2mm !important;
            }

            /* Cut line */
            .cut-line {
                display: block !important;
                text-align: center !important;
                font-size: 8pt !important;
                color: #999 !important;
                padding: 3mm 0 !important;
                letter-spacing: 2px !important;
            }

            .cut-line::before {
                content: "- - - - - - - - - - - - - - - - - -";
            }
        }

        /* Receipt footer (hidden on screen, shown on print) */
        .receipt-footer, .cut-line {
            display: none;
        }

        @media (max-width: 480px) {
            .gift-grid {
                grid-template-columns: 1fr;
            }
            .offer-product {
                flex-direction: column;
                text-align: center;
            }
            .countdown-digits {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="offer-page">
    <header class="offer-header">
        <div class="container">
            <img src="assets/zerolines-logo.png" alt="Zero Lines">
        </div>
    </header>

    <main id="offer-content">
        <!-- Dynamic content rendered by offer.js -->
        <div class="offer-hero">
            <div class="container">
                <div class="offer-eyebrow">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Oferta Exclusiva
                </div>
                <h1 class="offer-title">Cargando oferta...</h1>
                <p class="offer-customer">Por favor espere</p>
            </div>
        </div>
    </main>

    <footer class="offer-footer">
        <div class="container">
            <p>Zero Lines — Andorra — info@zerolines.life — +350 5400 5198</p>
            <p style="margin-top:0.5rem;">Esta oferta es personal y tiene validez limitada.</p>
        </div>
    </footer>

    <!-- Thermal receipt elements (visible only when printed) -->
    <div class="receipt-footer">
        Gracias por su confianza<br>
        Zero Lines — Andorra<br>
        info@zerolines.life — +350 5400 5198
    </div>
    <div class="cut-line"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/offer.js"></script>
</body>
</html>
